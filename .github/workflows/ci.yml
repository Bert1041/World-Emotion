name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs (tags are mutable). Bump deliberately; keep the
      # same 14-day minimum age used for npm packages (docs/decisions/0002).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Generated geo files must match a fresh build from the pinned, checksum-verified sources.
      - run: pnpm --filter @world-emotion/geo-data check:data
      # Initial JS < 150 KB gzipped (README §8.7); lazy map data excluded.
      - run: pnpm --filter @world-emotion/web budget
      # D1 migration forward + rollback with row counts, on a throwaway local database.
      - run: pnpm --filter @world-emotion/api check:migrations
      # Spikes, replays, waves, trolls, purge against a real `wrangler dev` + local D1.
      - run: pnpm --filter @world-emotion/simulate simulate

  e2e:
    # Browser layout tests (apps/web/e2e): "no text on the Earth" at 11 viewports, in the Google
    # Chrome preinstalled on the runner (Playwright channel "chrome"; no browser download).
    # Three shards in parallel: the whole suite outgrew the 15-minute limit on one runner (every
    # run from 2026-11-10 to 2026-11-22 was cancelled at 15 min, all tests passing until then).
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 20, not 15: the shard holding the live API tests took 12m47s on PR #14 (2026-11-22).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      # Render like an Android phone: "system-ui" there is Roboto. The runner's default sans is a
      # wide desktop font, which wrapped a line that fits on 360 px phones (2026-11-22). Prints
      # what the two generic families resolve to, so the log shows the font in use.
      - name: Phone-like system font (Roboto)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto >/dev/null
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f >/dev/null
          echo "system-ui -> $(fc-match system-ui)"; echo "sans-serif -> $(fc-match sans-serif)"
      - run: pnpm --filter @world-emotion/web test:e2e --shard=${{ matrix.shard }}/3
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
