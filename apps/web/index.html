<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>World Emotion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%237fd6e0%22/%3E%3C/svg%3E" />
    <style>
      :root {
        /* Fluid type: 15 px on phones up to 22 px on very large screens. Every UI size below is
           in rem, so text and controls scale with the screen instead of shrinking to specks. */
        font-size: clamp(15px, 0.45vw + 8.5px, 22px);
        --text: #f4efe6;
        --muted: rgba(244, 239, 230, 0.72);
        --glass: rgba(8, 8, 12, 0.55);
        --accent: #7fd6e0;
        --fast: 120ms;
        --base: 240ms;
        --slow: 600ms;
        --gap: 1rem;
      }
      html, body { margin: 0; height: 100%; background: #05070a; color: var(--text); overflow: hidden; }
      body { font: 1rem/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; -webkit-font-smoothing: antialiased; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* Theme overlays: compositor-friendly, opacity driven by the theme cross-fade. */
      .overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #scanlines { background: repeating-linear-gradient(0deg, rgba(61, 255, 138, 0.07) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
      #frost { background: radial-gradient(ellipse at center, transparent 55%, rgba(200, 225, 255, 0.28) 100%); }
      #heat { background: radial-gradient(ellipse at 50% 110%, rgba(255, 90, 30, 0.22), transparent 60%); }

      header { position: fixed; top: max(var(--gap), env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none;
        /* Equal sides, wide enough to clear the language switcher: centred, never under it. */
        padding: 0 calc(var(--gap) + 3.4rem);
        transition: transform var(--slow) cubic-bezier(.2, .8, .2, 1), opacity var(--base); }
      /* Zoomed into a region: the world headline gets out of the way of the map. */
      body.zoomed header { transform: translateY(-140%); opacity: 0; }
      .kicker { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0.25rem 0 0.15rem; font-size: clamp(1.45rem, 6vw, 2.2rem); font-weight: 650; }
      /* Start-up (bridge E4): a dim disc where the globe will be; a retry control if the map failed. */
      #loading-disc { position: fixed; left: 50%; top: 50%; width: min(70vw, 50vh); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, rgba(127, 214, 224, 0.16), rgba(10, 30, 50, 0.6) 70%, transparent 71%);
        animation: breathe 2.4s ease-in-out infinite; pointer-events: none; }
      @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      #failed { position: fixed; left: 0; right: 0; top: 50%; display: flex; justify-content: center; }
      #retry { padding: 0.6rem 1.1rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.3); background: var(--glass); color: var(--text); font: inherit; cursor: pointer; }
      #retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #world-mood { color: var(--accent); display: inline-block; transition: color var(--slow); }
      #world-mood.swap { animation: swap var(--slow) cubic-bezier(.2, .8, .2, 1); }
      @keyframes swap { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: none; } }

      #back { position: fixed; top: max(var(--gap), env(safe-area-inset-top)); left: var(--gap); padding: 0.5rem 0.8rem; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25); background: var(--glass); color: var(--text); font: inherit; cursor: pointer; }
      #back:focus-visible, #dev button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      /* Language switcher, top-right (decided 2026-11-09). The header's side padding clears it. */
      #lang { position: fixed; top: max(var(--gap), env(safe-area-inset-top)); right: max(var(--gap), env(safe-area-inset-right)); z-index: 3; }
      #lang .current { padding: 0.35rem 0.6rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.2); background: var(--glass);
        color: var(--muted); font: inherit; font-size: 0.8rem; letter-spacing: 0.04em; cursor: pointer; }
      #lang-menu { position: absolute; right: 0; top: calc(100% + 0.4rem); display: flex; flex-direction: column; min-width: 11rem; padding: 0.35rem;
        border-radius: 0.8rem; border: 1px solid rgba(255, 255, 255, 0.15); background: var(--glass-strong, rgba(10, 12, 18, 0.92)); }
      #lang-menu button, #lang-menu a { padding: 0.5rem 0.7rem; border: 0; border-radius: 0.5rem; background: none; color: var(--text); font: inherit;
        text-align: left; cursor: pointer; text-decoration: none; }
      #lang-menu button[aria-current="true"] { color: var(--accent); }
      #lang-menu button:hover, #lang-menu a:hover { background: rgba(255, 255, 255, 0.07); }
      #lang-menu .suggest { margin-top: 0.25rem; border-top: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0; font-size: 0.82rem; color: var(--muted); }
      #lang .current:focus-visible, #lang-menu button:focus-visible, #lang-menu a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Region card, solid so its text is never laid over the map. Portrait: bottom sheet.
         Landscape: a card at the side; the map is fitted into the space beside it. */
      #panel { position: fixed; left: var(--gap); right: var(--gap); bottom: max(var(--gap), env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto;
        max-height: 44vh; overflow: auto; padding: 0.9rem 1rem; border-radius: 1rem; background: rgba(10, 12, 16, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12); animation: rise var(--base) cubic-bezier(.2, .8, .2, 1); }
      @keyframes rise { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: none; } }
      /* Same query as SIDE_CARD in main.ts: one definition of "landscape". */
      @media (min-aspect-ratio: 6/5) {
        #panel { left: 1.5rem; right: auto; top: 50%; bottom: auto; width: 20rem; margin: 0; max-height: 80vh;
          transform: translateY(-50%); animation: slide var(--base) cubic-bezier(.2, .8, .2, 1); }
        @keyframes slide { from { opacity: 0; transform: translate(-1.5rem, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
      }
      /* Peek card grab handle (portrait only; Panel.svelte renders it only for the bottom sheet). */
      #panel-handle { display: block; width: 100%; height: 1.4rem; margin: -0.5rem 0 0.1rem; padding: 0; border: 0; background: none; cursor: pointer; }
      #panel-handle::before { content: ""; display: block; width: 2.6rem; height: 0.3rem; margin: 0 auto; border-radius: 0.15rem; background: rgba(255, 255, 255, 0.35); }
      #panel-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #panel h2 { margin: 0.15rem 0 0; font-size: 1.3rem; }
      #panel-mood { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 650; margin: 0 0 0.15rem; }
      #panel-sub { color: var(--muted); font-size: 0.87rem; margin: 0 0 0.65rem; }
      #bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
      #bars li { display: grid; grid-template-columns: 4.8rem 1fr 2.7rem; align-items: center; gap: 0.5rem; font-size: 0.87rem; color: var(--muted); }
      #bars li.lead { color: var(--text); font-weight: 600; }
      .track { height: 0.5rem; border-radius: 0.25rem; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .fill { display: block; height: 100%; transform-origin: left; transform: scaleX(0); transition: transform var(--slow) cubic-bezier(.2, .8, .2, 1); }
      .pct { text-align: right; font-variant-numeric: tabular-nums; }

      #world-count { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
      .count { font-variant-numeric: tabular-nums; color: var(--text); }

      /* Check-in bar (world view): solid like the card, so its text never sits on the map. */
      #checkin { position: fixed; left: var(--gap); right: var(--gap); bottom: max(var(--gap), env(safe-area-inset-bottom)); max-width: 30rem; margin: 0 auto;
        padding: 0.6rem 0.7rem 0.55rem; border-radius: 1rem; background: rgba(10, 12, 16, 0.94); border: 1px solid rgba(255, 255, 255, 0.12); text-align: center; }
      #checkin .prompt { font-size: 0.87rem; color: var(--muted); margin-bottom: 0.35rem; }
      #checkin .faces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.2rem; }
      #checkin .face { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.3rem 0 0.25rem; border: 0; border-radius: 0.6rem;
        background: none; color: var(--text); font: 0.78rem/1.1 system-ui, sans-serif; cursor: pointer; transition: transform var(--fast), background var(--fast); }
      #checkin .face:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); }
      #checkin .face:active:not(:disabled) { transform: scale(0.92); }
      #checkin .face:disabled { opacity: 0.35; cursor: not-allowed; }
      #checkin .face:focus-visible, #checkin .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #checkin .stack { display: grid; }
      #checkin .stack > * { grid-area: 1 / 1; transition: opacity var(--base); }
      #checkin .stack > .off { opacity: 0; visibility: hidden; }
      #checkin .chip { font-size: 1rem; align-self: center; }
      /* Who else feels it (bridge R1): quieter than "You feel …", may wrap on a phone. */
      #checkin .chip .alongside { margin-top: 0.3rem; font-size: 0.82rem; color: var(--muted); line-height: 1.3; }
      #checkin .chip .alongside .like { color: var(--text); }
      /* Text links keep their look; the hit area is at least 24 px tall (WCAG 2.5.8, bridge U3). */
      #checkin .link { border: 0; padding: 0.3rem 0.25rem; margin: -0.3rem -0.25rem; background: none; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
      /* Your country is below the privacy floor (bridge SC): say so before the check-in, not after. */
      #checkin .small-country { margin-top: 0.45rem; font-size: 0.78rem; color: var(--muted); }
      /* One-time hint under the back button (bridge U6). */
      #hint { position: fixed; top: calc(max(var(--gap), env(safe-area-inset-top)) + 3rem); left: var(--gap); padding: 0.4rem 0.7rem; border-radius: 999px;
        background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.2); font-size: 0.85rem; pointer-events: none; animation: rise var(--base) cubic-bezier(.2, .8, .2, 1); }
      #checkin .from { display: flex; align-items: center; justify-content: center; gap: 0.35rem; margin-top: 0.65rem; font-size: 0.82rem; color: var(--muted); }
      /* Your location as a badge: a pill with room around the pin and name. */
      #checkin .from .place { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.75rem 0.3rem 0.6rem; border-radius: 999px;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
      #checkin .from .where { color: var(--text); }
      /* First run (bridge J2): the place row sits above the faces. */
      #checkin .from.first { margin: 0 0 0.65rem; }
      #checkin .pin path { fill: var(--accent); }
      #checkin .pin circle { fill: #0a0c10; }
      #checkin .pick { display: flex; flex-direction: column; gap: 0.35rem; justify-content: center; }
      #checkin .pick .prompt { margin: 0; }
      #checkin .tap-hint { color: var(--text); }
      #checkin .search { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.3rem 0.5rem; font-size: 0.82rem; color: var(--muted); }
      /* 16 px minimum: iOS zooms the whole page into any smaller input when it is focused. */
      #checkin .search input { width: min(15rem, 100%); padding: 0.5rem 0.9rem; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px;
        background: rgba(255, 255, 255, 0.07); color: var(--text); font: max(16px, 1rem) system-ui, sans-serif; }
      #checkin .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      #checkin .results { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; min-height: 1.7rem; }
      #checkin .result { padding: 0.25rem 0.6rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px; background: none;
        color: var(--text); font: 0.78rem system-ui, sans-serif; cursor: pointer; }
      #checkin .result:hover { background: rgba(255, 255, 255, 0.08); }
      #checkin .result:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #checkin .none { font-size: 0.78rem; color: var(--muted); align-self: center; }
      /* Wide enough (and not a phone on its side): one slim row. Prompt and faces on the left, your
         country in its own section on the right, so the bar takes little of the globe's height. */
      @media (min-width: 720px) and (min-height: 521px) {
        #checkin:not([hidden]) { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 1rem; max-width: 46rem; padding: 0.5rem 0.9rem; }
        #checkin .faces-layer { display: flex; align-items: center; gap: 0.8rem; }
        #checkin .faces-layer .prompt { margin: 0; width: 6.2rem; text-align: left; line-height: 1.25; }
        #checkin .faces { flex: 1; }
        #checkin .from { flex-direction: column; gap: 0.35rem; margin: 0; padding: 0.3rem 0 0.3rem 1rem; border-left: 1px solid rgba(255, 255, 255, 0.12); align-self: stretch; }
        #checkin .from .dot { display: none; }
        /* Columns are fixed, so the first-run order in the DOM does not swap them. */
        #checkin .stack { grid-column: 1; grid-row: 1; }
        #checkin .from, #checkin .from.first { grid-column: 2; grid-row: 1; margin: 0; }
      }
      /* A phone on its side has no height to spare: a panel on the right, sized to its content.
         Same query as DOCK_RIGHT in main.ts. */
      @media (min-aspect-ratio: 6/5) and (max-height: 520px) {
        /* :not([hidden]): an id selector setting display would otherwise beat [hidden]. */
        #checkin:not([hidden]) { left: auto; right: max(var(--gap), env(safe-area-inset-right)); top: 0; bottom: 0; margin: auto 0; height: fit-content;
          max-height: calc(100vh - 2 * var(--gap)); width: 12.5rem; max-width: none; display: flex; flex-direction: column; justify-content: center; }
        #checkin .faces { grid-template-columns: repeat(3, 1fr); row-gap: 0.4rem; }
        /* No room for the first-run label in a 12.5rem column: the place row still leads, with "not you?". */
        #checkin .from .label { display: none; }
        /* Badge over link, in a row of fixed height: a long name or a long link ("ce n'est pas
           ça ?") must not make the bar taller in one mode than another. */
        #checkin .from { flex-direction: column; justify-content: center; min-height: 3.9rem; }
        #checkin .from .dot { display: none; }
        /* Centre the headline over the globe's column, not the whole screen. */
        header { right: calc(12.5rem + 2 * var(--gap)); }
      }
      /* ?dev=1: the prototype bar sits under the check-in bar, which moves up to make room. */
      body.dev #checkin { bottom: calc(max(var(--gap), env(safe-area-inset-bottom)) + 2.6rem); }
      .flight { position: fixed; left: 0; top: 0; margin: -22px 0 0 -22px; pointer-events: none; z-index: 10; will-change: translate, scale; }

      #dev { position: fixed; left: 0.75rem; bottom: 0.75rem; gap: 0.4rem; grid-auto-flow: column; opacity: 0.85; }
      #dev:not([hidden]) { display: grid; }
      #dev button { font: 0.8rem system-ui; padding: 0.3rem 0.5rem; border-radius: 0.5rem; border: 1px solid; background: var(--glass); color: var(--text); cursor: pointer; }
      #perf { position: fixed; left: 0.5rem; bottom: 3.5rem; padding: 0.4rem 0.5rem; background: rgba(0, 0, 0, 0.6); border-radius: 0.4rem;
        white-space: pre; font: 0.7rem/1.35 ui-monospace, monospace; pointer-events: none; }
      [hidden] { display: none; }

      @media (prefers-reduced-motion: reduce) {
        #world-mood.swap, #panel, #loading-disc, #hint { animation: none; }
        .fill { transition: none; }
        /* Cross-fades only: the headline fades away when zoomed, it does not slide. */
        header { transition: opacity var(--base); }
        body.zoomed header { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="base"></canvas><canvas id="fx" aria-label="Globe showing how the world feels. Tap a country to explore its continent."></canvas></div>
    <div id="scanlines" class="overlay"></div>
    <div id="frost" class="overlay"></div>
    <div id="heat" class="overlay"></div>
    <!-- Header, back button, region card, dev bar: src/ui/App.svelte (mounted by main.ts). -->
    <div id="ui"></div>
    <div id="perf" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
