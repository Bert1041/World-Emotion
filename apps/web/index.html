<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>World Emotion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%237fd6e0%22/%3E%3C/svg%3E" />
    <style>
      :root {
        /* Fluid type: 15 px on phones up to 22 px on very large screens. Every UI size below is
           in rem, so text and controls scale with the screen instead of shrinking to specks. */
        font-size: clamp(15px, 0.45vw + 8.5px, 22px);
        --text: #f4efe6;
        --muted: rgba(244, 239, 230, 0.72);
        --glass: rgba(8, 8, 12, 0.55);
        --accent: #7fd6e0;
        --fast: 120ms;
        --base: 240ms;
        --slow: 600ms;
        --gap: 1rem;
      }
      html, body { margin: 0; height: 100%; background: #05070a; color: var(--text); overflow: hidden; }
      body { font: 1rem/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; -webkit-font-smoothing: antialiased; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* Theme overlays: compositor-friendly, opacity driven by the theme cross-fade. */
      .overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #scanlines { background: repeating-linear-gradient(0deg, rgba(61, 255, 138, 0.07) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
      #frost { background: radial-gradient(ellipse at center, transparent 55%, rgba(200, 225, 255, 0.28) 100%); }
      #heat { background: radial-gradient(ellipse at 50% 110%, rgba(255, 90, 30, 0.22), transparent 60%); }

      header { position: fixed; top: max(var(--gap), env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 var(--gap);
        transition: transform var(--slow) cubic-bezier(.2, .8, .2, 1), opacity var(--base); }
      /* Zoomed into a region: the world headline gets out of the way of the map. */
      body.zoomed header { transform: translateY(-140%); opacity: 0; }
      .kicker { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0.25rem 0 0.15rem; font-size: clamp(1.45rem, 6vw, 2.2rem); font-weight: 650; }
      #world-mood { color: var(--accent); display: inline-block; transition: color var(--slow); }
      #world-mood.swap { animation: swap var(--slow) cubic-bezier(.2, .8, .2, 1); }
      @keyframes swap { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: none; } }
      #theme-name { font-size: 0.87rem; color: var(--muted); }

      #back { position: fixed; top: max(var(--gap), env(safe-area-inset-top)); left: var(--gap); padding: 0.5rem 0.8rem; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25); background: var(--glass); color: var(--text); font: inherit; cursor: pointer; }
      #back:focus-visible, #dev button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Region card, solid so its text is never laid over the map. Portrait: bottom sheet.
         Landscape: a card at the side; the map is fitted into the space beside it. */
      #panel { position: fixed; left: var(--gap); right: var(--gap); bottom: max(var(--gap), env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto;
        max-height: 44vh; overflow: auto; padding: 0.9rem 1rem; border-radius: 1rem; background: rgba(10, 12, 16, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12); animation: rise var(--base) cubic-bezier(.2, .8, .2, 1); }
      @keyframes rise { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: none; } }
      /* Same query as SIDE_CARD in main.ts: one definition of "landscape". */
      @media (min-aspect-ratio: 6/5) {
        #panel { left: 1.5rem; right: auto; top: 50%; bottom: auto; width: 20rem; margin: 0; max-height: 80vh;
          transform: translateY(-50%); animation: slide var(--base) cubic-bezier(.2, .8, .2, 1); }
        @keyframes slide { from { opacity: 0; transform: translate(-1.5rem, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
      }
      #panel h2 { margin: 0.15rem 0 0; font-size: 1.3rem; }
      #panel-mood { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 650; margin: 0 0 0.15rem; }
      #panel-sub { color: var(--muted); font-size: 0.87rem; margin: 0 0 0.65rem; }
      #bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
      #bars li { display: grid; grid-template-columns: 4.8rem 1fr 2.7rem; align-items: center; gap: 0.5rem; font-size: 0.87rem; color: var(--muted); }
      #bars li.lead { color: var(--text); font-weight: 600; }
      .track { height: 0.5rem; border-radius: 0.25rem; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .fill { display: block; height: 100%; transform-origin: left; transform: scaleX(0); transition: transform var(--slow) cubic-bezier(.2, .8, .2, 1); }
      .pct { text-align: right; font-variant-numeric: tabular-nums; }

      #dev { position: fixed; left: 0.75rem; bottom: 0.75rem; gap: 0.4rem; grid-auto-flow: column; opacity: 0.85; }
      #dev:not([hidden]) { display: grid; }
      #dev button { font: 0.8rem system-ui; padding: 0.3rem 0.5rem; border-radius: 0.5rem; border: 1px solid; background: var(--glass); color: var(--text); cursor: pointer; }
      #perf { position: fixed; left: 0.5rem; bottom: 3.5rem; padding: 0.4rem 0.5rem; background: rgba(0, 0, 0, 0.6); border-radius: 0.4rem;
        white-space: pre; font: 0.7rem/1.35 ui-monospace, monospace; pointer-events: none; }
      [hidden] { display: none; }

      @media (prefers-reduced-motion: reduce) {
        #world-mood.swap, #panel { animation: none; }
        .fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="base"></canvas><canvas id="fx" aria-label="Globe showing how the world feels. Tap a country to explore its continent."></canvas></div>
    <div id="scanlines" class="overlay"></div>
    <div id="frost" class="overlay"></div>
    <div id="heat" class="overlay"></div>
    <header>
      <div class="kicker">Right now</div>
      <h1>The world feels <span id="world-mood" aria-live="polite"></span></h1>
      <div id="theme-name"></div>
    </header>
    <button id="back" type="button" hidden>← World</button>
    <section id="panel" hidden aria-live="polite">
      <div class="kicker">Right now</div>
      <h2 id="panel-title">Region</h2>
      <div id="panel-mood"></div>
      <div id="panel-sub"></div>
      <ul id="bars"></ul>
    </section>
    <nav id="dev" aria-label="Preview a world mood (prototype only)"></nav>
    <div id="perf" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
